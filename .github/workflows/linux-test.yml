name: Linux installer and playback
on:
  push:
    paths: ['linux/**', '.github/workflows/linux-test.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set isolated test directories
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/snoopy-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/snoopy-data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/snoopy-cache" >> "$GITHUB_ENV"
      - name: Install published application and complete media
        run: python3 linux/online_install.py
      - name: Rules, update integrity and installer checks
        working-directory: linux
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Native cloudy playback
        run: snoopy-linux --smoke 90 --doghouse --weather cloudy --report cloud-test.json
      - name: Verify new interaction library and playback
        run: |
          /usr/bin/python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["XDG_DATA_HOME"])/"SnoopyLinux/Media-1/IdleAssets/interactions.json"; assert len(json.loads(p.read_text())["Assets"])==119; r=json.loads(Path("cloud-test.json").read_text()); assert r["action_frames"]+r["visitor_frames"]>0, r'
      - name: Native movie playback
        run: snoopy-linux --smoke 8 --report movie-test.json
      - name: Native doghouse to movie to doghouse transition
        run: /usr/bin/python3 linux/tests/playback_check.py "$XDG_DATA_HOME/SnoopyLinux/Media-1" transitions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-${{ matrix.runner }}
          path: |
            cloud-test.json
            movie-test.json
            transitions.json
